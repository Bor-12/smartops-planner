spring:
  application:
    name: smartops-planner

  datasource:
    url: jdbc:postgresql://localhost:5432/smartops
    username: smartops
    password: smartops
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080