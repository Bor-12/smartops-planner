spring:
  application:
    name: smartops-planner

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartops}
    username: ${SPRING_DATASOURCE_USERNAME:smartops}
    password: ${SPRING_DATASOURCE_PASSWORD:smartops}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:smartops-planner-local-development-secret-please-change}
      expiration-seconds: ${APP_SECURITY_JWT_EXPIRATION_SECONDS:86400}
