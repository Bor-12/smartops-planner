name: CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  test:
    name: Tests and JAR build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartops
          POSTGRES_USER: smartops
          POSTGRES_PASSWORD: smartops
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smartops -d smartops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smartops
      SPRING_DATASOURCE_USERNAME: smartops
      SPRING_DATASOURCE_PASSWORD: smartops
      APP_SECURITY_JWT_SECRET: ci-test-secret-change-in-real-environments

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Build JAR
        run: mvn -B -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartops-planner-jar
          path: target/*.jar
          if-no-files-found: error
