name: Docker

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: smartops-planner
  CONTAINER_APP_NAME: smartops-planner-app
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  docker:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "tags=$DOCKERHUB_USERNAME/$IMAGE_NAME:${GITHUB_SHA},$DOCKERHUB_USERNAME/$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=$DOCKERHUB_USERNAME/$IMAGE_NAME:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE_NAME:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "deploy_tag=$IMAGE_NAME:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update container app image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "$DOCKERHUB_USERNAME/$IMAGE_NAME:${GITHUB_SHA}"
