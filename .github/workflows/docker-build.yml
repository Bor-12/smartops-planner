name: Docker

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: smartops-planner
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  docker:
    name: Build and optionally publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "tags=$DOCKERHUB_USERNAME/$IMAGE_NAME:${GITHUB_SHA},$DOCKERHUB_USERNAME/$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE_NAME:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
